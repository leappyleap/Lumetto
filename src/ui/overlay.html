<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Lumetto overlay</title>
  <style>
    :root {
      --accent: #d6b48c;
      --danger: #d38d7e;
      --text: #eceae5;
      --muted: #9a978f;
      --line: rgba(255, 255, 255, 0.1);
      --thumb-w: 248px;
      --aspect: 1.7778;
      --gap: 22px;
      --inset-r: 0px;
      --inset-b: 0px;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); }

    /* Вспышка — чистый белый, как у скриншота на iPhone */
    #flash { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0; background: #fff; }

    /* Превью в углу */
    #thumb {
      position: fixed;
      right: calc(var(--gap) + var(--inset-r));
      bottom: calc(var(--gap) + var(--inset-b));
      width: var(--thumb-w);
      height: calc(var(--thumb-w) / var(--aspect));
      transform-origin: 0 0;
      opacity: 0;
      pointer-events: none;
      will-change: transform;
    }
    #thumb.on { opacity: 1; pointer-events: auto; cursor: pointer; }
    .inner {
      position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
      background: #0e0e10;
      box-shadow: 0 0 0 1px var(--line), 0 18px 40px -10px rgba(0, 0, 0, .55), 0 4px 12px rgba(0, 0, 0, .3);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
    }
    #thumb:hover .inner { transform: scale(1.035); box-shadow: 0 0 0 1px rgba(255, 255, 255, .16), 0 24px 50px -12px rgba(0, 0, 0, .6), 0 4px 12px rgba(0, 0, 0, .3); }
    #thumb:active .inner { transform: scale(.98); }
    .inner img, .inner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .inner video { opacity: 0; transition: opacity .5s cubic-bezier(.2, .8, .2, 1); }
    .inner video.on { opacity: 1; }

    /* «LIVE» пока дописываются секунды после нажатия */
    .live {
      position: absolute; top: 8px; left: 8px; height: 22px; padding: 0 8px 0 7px;
      display: flex; align-items: center; gap: 6px;
      border-radius: 999px; background: rgba(14, 14, 16, .55); backdrop-filter: blur(8px);
      font-size: 10px; font-weight: 600; letter-spacing: .07em; color: rgba(255, 255, 255, .9);
      transition: opacity .3s, transform .3s;
    }
    .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; transform: scale(.75); } }
    /* LIVE и полоска проявляются, только когда превью «село» в угол */
    .live, .bar { opacity: 0; }
    #thumb.settled .live, #thumb.settled .bar { opacity: 1; }
    #thumb.saved .live { opacity: 0; transform: translateY(-4px); }

    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0, 0, 0, .35); transition: opacity .3s; }
    .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
    #thumb.saved .bar { opacity: 0; }

    .check {
      position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(14, 14, 16, .6); backdrop-filter: blur(8px); color: var(--accent);
      opacity: 0; transform: scale(.4);
    }
    .check svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .check path { stroke-dasharray: 20; stroke-dashoffset: 20; }
    .saved .check { animation: pop .5s cubic-bezier(.3, 1.4, .5, 1) forwards; }
    .saved .check path { animation: draw .4s .15s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Ошибки — карточка в том же углу */
    #err {
      position: fixed;
      right: calc(var(--gap) + var(--inset-r)); bottom: calc(var(--gap) + var(--inset-b));
      width: 320px; padding: 14px 18px;
      background: rgba(26, 26, 29, .97); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .38);
      opacity: 0; transform: translateX(24px); pointer-events: none;
    }
    #err b { display: block; font-weight: 600; font-size: 14px; color: var(--danger); }
    #err span { display: block; color: var(--muted); margin-top: 2px; }

    @media (prefers-reduced-motion: reduce) {
      #flash { display: none; }
    }
  </style>
</head>
<body>
  <div id="flash"></div>

  <div id="thumb">
    <div class="inner">
      <img id="img" alt="">
      <video id="vid" muted loop playsinline></video>
      <span class="live"><i></i>LIVE</span>
      <span class="check"><svg viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9"/></svg></span>
      <span class="bar"><i id="bar"></i></span>
    </div>
  </div>

  <div id="err"><b id="errTitle"></b><span id="errText"></span></div>

  <script src="overlay.js"></script>
</body>
</html>
